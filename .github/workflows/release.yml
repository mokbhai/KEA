name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: macos-15
    # A cold Tauri release build of this workspace (whisper, parakeet, cpal,
    # rodio) plus the tests does not fit in 60 minutes on a macOS runner.
    timeout-minutes: 120

    env:
      # Promoted to job-level env so later steps can gate on presence: the
      # `secrets` context is NOT allowed in step-level `if:` expressions (it
      # fails workflow validation), but `env` is. This is also what makes the
      # bundler emit the signed *.app.tar.gz + .sig instead of refusing to build.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
      # Keeps the updater manifest URLs pointed at whatever repo built them.
      KEA_REPO_SLUG: ${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # `cargo install tauri-cli` compiles the CLI from source and costs several
      # minutes on every run; cache the resulting binary keyed on the pinned
      # major so it is built once per runner image.
      - name: Cache Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: ${{ runner.os }}-cargo-tauri-v2

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="$(./scripts/current_version.sh)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Verify release notes exist for this tag
        run: ./scripts/extract_release_notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md

      # Lint and test only. The bundle build deliberately does NOT run here:
      # `make release-check` would build the app once, and package_release.sh
      # then ran `make clean` + a second full build, discarding the first. The
      # single signed build below replaces both.
      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build and package release artifacts
        run: ./scripts/package_release.sh --features updater

      - name: Verify updater artifacts were signed
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! -f "dist/latest.json" ]]; then
            echo "dist/latest.json missing - the bundler produced no signed updater artifacts." >&2
            echo "Check that TAURI_SIGNING_PRIVATE_KEY is set and bundle.createUpdaterArtifacts is true." >&2
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("dist/latest.json", "utf8"));
            const expected = "v" + process.argv[1];
            if (m.version !== expected) {
              throw new Error(`latest.json version ${m.version} != ${expected}`);
            }
            const p = m.platforms["darwin-aarch64"];
            if (!p || !p.signature || !p.url) {
              throw new Error("latest.json is missing a darwin-aarch64 signature/url");
            }
          ' "$VERSION"
          echo "Updater manifest verified:"
          cat dist/latest.json

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: KEA-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            dist/KEA-*.zip
            dist/KEA_*.dmg
            dist/KEA_*.app.tar.gz
            dist/KEA_*.app.tar.gz.sig
            dist/latest.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/KEA-*.zip
            dist/KEA_*.dmg
            dist/KEA_*.app.tar.gz
            dist/KEA_*.app.tar.gz.sig
            dist/latest.json
