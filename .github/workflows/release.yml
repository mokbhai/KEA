name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: macos-15
    timeout-minutes: 60

    # Promote the signing key to a job-level env var so the conditional step
    # below can gate on it: the `secrets` context is NOT allowed in step-level
    # `if:` expressions (it fails workflow validation), but `env` is.
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix ui install

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="$(./scripts/current_version.sh)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Run checks
        run: make release-check

      - name: Build release artifacts
        run: ./scripts/package_release.sh

      # Updater artifacts are produced by the Tauri bundler itself (correct
      # ed25519 .sig), NOT hand-rolled — the previous openssl SHA256 signing
      # produced signatures the client always rejected. Runs only when a
      # signing key is present; the maintainer must also set a non-empty
      # bundle.updater.pubkey in tauri.conf.json (see docs/RELEASE.md), which
      # is what makes the bundler emit the signed *.app.tar.gz + .sig.
      - name: Build signed updater artifacts (conditional on signing key)
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        env:
          # TAURI_SIGNING_PRIVATE_KEY is inherited from the job-level env above.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # The bundler emits the updater archive + ed25519 signature only when
          # built with the updater feature and bundle.createUpdaterArtifacts
          # enabled in tauri.conf.json (see docs/RELEASE.md).
          cargo tauri build --features updater

          # `|| true`: find exits non-zero when the src-tauri/target path is
          # absent (workspace builds only populate target/), which would abort
          # the step under `set -euo pipefail` before the guard below runs.
          TAR_GZ="$(find target/release/bundle/macos src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' 2>/dev/null | head -n 1 || true)"
          SIG_FILE="$(find target/release/bundle/macos src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz.sig' 2>/dev/null | head -n 1 || true)"
          if [[ -z "$TAR_GZ" || -z "$SIG_FILE" ]]; then
            echo "Bundler did not produce updater artifacts. Ensure bundle.updater.pubkey is set in tauri.conf.json." >&2
            exit 1
          fi

          # The client verifies against the CONTENTS of the .sig file (base64
          # ed25519), not an openssl digest.
          SIG="$(cat "$SIG_FILE")"
          OUT_TAR="KEA_${VERSION}_aarch64.app.tar.gz"
          cp "$TAR_GZ" "$OUT_TAR"

          cat > latest.json << JSONEOF
          {
            "version": "v${VERSION}",
            "notes": "KEA ${VERSION}",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${SIG}",
                "url": "https://github.com/mokbhai/vox/releases/download/v${VERSION}/${OUT_TAR}"
              }
            }
          }
          JSONEOF

          mkdir -p dist
          mv "$OUT_TAR" latest.json dist/
          echo "Signed updater artifacts ready: dist/${OUT_TAR}, dist/latest.json"

      - name: Extract release notes
        run: |
          ./scripts/extract_release_notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: KEA-${{ github.ref_name }}
          path: |
            dist/KEA-*.zip
            dist/KEA-*.dmg
            dist/KEA_*.dmg
            dist/KEA_*.app.tar.gz
            dist/latest.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/KEA-*.zip
            dist/KEA-*.dmg
            dist/KEA_*.dmg
            dist/KEA_*.app.tar.gz
            dist/latest.json
