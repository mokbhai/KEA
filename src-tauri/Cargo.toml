[package]
name = "kea-app"
version = "0.3.0"
edition = "2021"

[features]
# The local engines ship by default: the picker offers Whisper/Parakeet/local
# voices and downloads their models, so a build without them registered lets a
# user fetch a gigabyte and then hit "unknown engine id" when it is selected.
default = ["whisper", "parakeet", "streaming", "tts-local", "tts-system", "stt-apple"]
updater = ["tauri-plugin-updater"]
whisper = ["kea-engines/whisper", "kea-infer/whisper"]
# macOS-only; selected by host in the Makefile and per-runner in release.yml,
# never in `default` (which Linux and Windows share).
whisper-metal = ["whisper", "kea-engines/whisper-metal"]
whisper-coreml = ["whisper", "kea-engines/whisper-coreml"]
parakeet = ["kea-engines/parakeet"]
# Live partial transcripts. In `default` for the same reason as the others: the
# Models page offers the download, and a build without the engine registered
# would let a user fetch it and get nothing.
streaming = ["kea-engines/streaming"]
tts-local = ["kea-engines/tts-local"]
# Registered only on macOS (see `build_engines`); the feature itself builds
# everywhere so the workspace has one feature set.
tts-system = ["kea-engines/tts-system"]
# Apple's on-device recognizer. Registered only on macOS and only where the OS
# reports on-device recognition (see `register_apple_stt_engine`); the feature
# builds everywhere so the workspace has one feature set.
stt-apple = ["kea-engines/stt-apple"]
sherpa = ["kea-infer/sherpa"]

# macOS only, and only for the dictation overlay: tao exposes
# `visible_on_all_workspaces`, which sets NSWindowCollectionBehaviorCanJoinAllSpaces
# and nothing else. Floating over ANOTHER app's full-screen space additionally
# needs NSWindowCollectionBehaviorFullScreenAuxiliary, which Tauri does not
# surface, so the NSWindow has to be addressed directly. objc2 is already in the
# tree via kea-platform; objc2-app-kit is deliberately not pulled in for two
# selectors.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kea-core = { path = "../crates/core" }
kea-engines = { path = "../crates/engines" }
kea-features = { path = "../crates/features" }
kea-platform = { path = "../crates/platform" }
kea-infer = { path = "../crates/infer" }
# `macos-private-api` is what makes the transparent overlay window legal on
# macOS; without it `WebviewWindowBuilder::transparent` is not even compiled.
# Mirrored by `app.macOSPrivateApi` in tauri.conf.json.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
# The "Choose file…" half of file transcription. Drag-and-drop alone is
# unusable with a keyboard, and the same plugin covers "Save as…" for the
# subtitle export. Its `dialog:default` permission is added to
# capabilities/default.json alongside the others.
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
sqlx.workspace = true
async-trait.workspace = true
reqwest.workspace = true
tempfile.workspace = true
# The palette's "copy the answer" delivery. Already the clipboard crate on the
# paste path inside kea-platform; `TextIo` has no "just copy this" method, so
# the one place that needs one reaches for the same crate rather than inventing
# a second clipboard abstraction. See `commands::copy_to_clipboard`.
arboard.workspace = true
futures-util.workspace = true
sha2.workspace = true
# The local API server (see `crate::api`). hyper and hyper-util are already in
# the tree as reqwest's HTTP *client*; naming them here turns on hyper's
# `server` feature, which adds no new crate to the graph but does recompile
# hyper (and therefore reqwest) with the server modules linked in. That is the
# real cost — a rebuild and a few tens of KB of binary — and it buys correct
# HTTP/1.1 framing (chunked bodies, header folding, malformed-request
# rejection) that a hand-rolled reader over a socket would get subtly wrong.
hyper = { version = "1", features = ["server", "http1"] }
# `TokioIo` only; it is what lets hyper serve over an arbitrary tokio stream,
# which is the whole reason a unix socket is possible here.
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
# `RunEvent::Opened` hands us `url::Url` already, and `query_pairs()` is the
# percent- and plus-decoding the kea:// grammar needs. Parsing it by hand would
# be a second, worse decoder.
url = "2"
# 32 bytes from the OS CSPRNG for the API token. Already in the tree
# transitively; named here because minting a bearer token from anything less
# than the platform entropy source is the kind of shortcut that ages badly.
getrandom = "0.3"

[dev-dependencies]
# A real HTTP server for the Notion client's tests: the headers Notion demands
# (`Notion-Version`) and the bodies it rejects can only be asserted against one.
wiremock.workspace = true
