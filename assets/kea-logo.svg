      <stop offset="0" stop-color="#2E5D50"/><stop offset="1" stop-color="#4E8A5B"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9CC456"/><stop offset="1" stop-color="#6E9A3C"/>
