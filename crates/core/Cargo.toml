[package]
name = "kea-core"
version = "0.1.0"
edition = "2021"

[dependencies]
kea-engines = { path = "../engines" }
# For `SpeakerSpan` only — the diarization *value* type, so the pure
# cue-to-speaker assignment in `transcript::speakers` can name it without the
# caller converting at every site. No inference happens in this crate.
kea-infer = { path = "../infer" }
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
keyring.workspace = true

[dev-dependencies]
kea-engines = { path = "../engines" }
tempfile.workspace = true
