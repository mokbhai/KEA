[package]
name = "kea-platform"
version = "0.1.0"
edition = "2021"

[features]
default = []
system-audio-sck = ["dep:screencapturekit"]

# The integration test launches the probe as a second process, so it is a
# binary target rather than an example: Cargo then exposes its stable
# `CARGO_BIN_EXE_chord-probe` path to the test.
[[bin]]
name = "chord-probe"
path = "src/bin/chord_probe.rs"
test = false
bench = false

[dependencies]
async-trait.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
arboard.workspace = true
global-hotkey.workspace = true
tracing.workspace = true
cpal.workspace = true
rodio.workspace = true
# Audio-file decoding for the file-transcription feature.
#
# Direct, not through `rodio::Decoder`, which is only ever constructed for
# playback here. rodio 0.19 pulls symphonia in with *only* `bundle-mp3`
# enabled (Cargo.lock), so routing through it would decode WAV, FLAC, Ogg and
# MP3 and reject exactly the containers this feature exists for: Voice Memos
# and iPhone recordings are `.m4a`, meeting and screen recordings `.mp4`/
# `.mov`. `all` turns on the ISO-MP4/CAF/MKV demuxers and the AAC/ALAC
# decoders alongside them, and it is symphonia's own feature name rather than
# a list that silently goes stale.
symphonia = { version = "0.5", features = ["all"] }
screencapturekit = { version = "7", optional = true, features = ["macos_13_0", "async"] }
# Region captures are pictures of someone's screen. NamedTempFile/TempDir own
# the file so Drop removes it on every path, including a panic, rather than
# leaving cleanup to each early return in the capture flow.
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.25"
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
# AVFAudio, for AVSpeechSynthesizer + AVAudioPCMBuffer. Only the speech and
# buffer pieces: the default feature set pulls in the whole audio engine,
# which is several hundred bindings this crate never touches.
objc2-avf-audio = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "AVAudioBuffer",
    "AVAudioFormat",
    "AVAudioTypes",
    "AVSpeechSynthesis",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
