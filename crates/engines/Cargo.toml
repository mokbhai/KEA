[package]
name = "kea-engines"
version = "0.1.0"
edition = "2021"

[features]
default = []
whisper = ["kea-infer/whisper", "dep:whisper-rs"]
whisper-metal = ["whisper", "kea-infer/whisper-metal"]
whisper-coreml = ["whisper", "kea-infer/whisper-coreml"]
parakeet = ["kea-infer/sherpa"]
tts-local = ["kea-infer/sherpa"]
# The OS synthesizer. A feature rather than an unconditional dependency
# because it is the only thing in this crate that needs the platform layer,
# and off macOS it would register an engine that can only refuse.
tts-system = ["dep:kea-platform"]

[dependencies]
kea-infer = { path = "../infer" }
kea-platform = { path = "../platform", optional = true }
reqwest = { workspace = true, features = ["multipart"] }
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
keyring.workspace = true

[dependencies.whisper-rs]
version = "0.13"
optional = true

[dev-dependencies]
wiremock.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
