[package]
name = "kea-infer"
version = "0.1.0"
edition = "2021"

[features]
default = []
whisper = ["dep:whisper-rs"]
sherpa = ["dep:sherpa-onnx"]
# whisper.cpp GPU/accelerator backends. Deliberately NOT in `default`: `metal`
# links macOS-only frameworks and the workspace is built for Linux and Windows
# in CI, so the selection is made by the host (Makefile) or the runner
# (release.yml) instead.
whisper-metal = ["whisper", "whisper-rs/metal"]
whisper-coreml = ["whisper", "whisper-rs/coreml"]

[dependencies]
async-trait.workspace = true
tracing.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde_json.workspace = true
tempfile.workspace = true
sha2.workspace = true
bzip2 = "0.5"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies.whisper-rs]
version = "0.13"
optional = true

[dependencies.sherpa-onnx]
version = "1.13.3"
optional = true
