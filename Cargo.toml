[workspace]
resolver = "2"
members = ["crates/core", "crates/engines", "crates/features", "crates/platform", "crates/infer", "src-tauri"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# keyring 3 ships no credential store by default — without a platform feature
# every write silently lands in a throwaway mock and nothing is ever persisted.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.10"
wiremock = "0.6"
arboard = "3"
enigo = "0.2"
global-hotkey = "0.6"
cpal = "0.15"
rodio = "0.19"
